name: Set up dev shell
description: Install Nix (the dev shell comes from flake.lock) and restore the PlatformIO cache
inputs:
  platformio:
    description: Restore/save ~/.platformio (ESP toolchain, ESP-IDF)
    default: "false"
runs:
  using: composite
  steps:
    # The dev shell (KiCad) plus ~2 GB of PlatformIO packages and the cache
    # archive can overflow small runners (~14 GB free on private-repo runners);
    # if space is short, drop preinstalled SDKs we never use (takes ~1.5 min).
    - name: Free disk space if needed
      if: inputs.platformio == 'true'
      shell: bash
      run: |
        free_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
        echo "free: ${free_gb} GB"
        if (( free_gb < 20 )); then
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          df -h /
        fi
    # PlatformIO from nixpkgs runs in a bubblewrap FHS sandbox, which needs
    # unprivileged user namespaces (restricted by AppArmor on Ubuntu 24.04).
    - name: Allow unprivileged user namespaces
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ github.token }}
        extra_nix_config: |
          experimental-features = nix-command flakes
    - name: Cache PlatformIO packages
      if: inputs.platformio == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.platformio
        key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'flake.lock') }}
        restore-keys: platformio-${{ runner.os }}-
