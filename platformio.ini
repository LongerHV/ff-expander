; ff-expander — wireless button link for ffbeast wheels
; Envs: tx (wheel), rx (base), native (host unit tests for lib/ffx_core)

[platformio]
default_envs = tx, rx

[esp]
platform = espressif32@8.0.0
board = seeed_xiao_esp32c6
framework = espidf
monitor_speed = 115200

[env:tx]
extends = esp
build_flags = -DFFX_ROLE_TX=1
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_10:BD:A3:B1:B9:84-if00
monitor_port = ${this.upload_port}

[env:rx]
extends = esp
build_flags = -DFFX_ROLE_RX=1
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_10:BD:A3:B1:B9:00-if00
monitor_port = ${this.upload_port}

[env:native]
platform = native
test_framework = unity
build_flags = -std=c11 -Wall -Wextra -Werror
