; ff-expander — wireless button link for ffbeast wheels
; Envs: tx (wheel), rx (base), native (host unit tests for lib/ffx_core)
;       tx-poc / rx-poc: 4-button proof of concept, RX wired straight to XDRIVE GPIOs

[platformio]
default_envs = tx, rx

[esp]
platform = espressif32@8.0.0
board = seeed_xiao_esp32c6
framework = espidf
monitor_speed = 115200
; warnings are errors in our sources (not in ESP-IDF)
build_src_flags = -Wall -Wextra -Werror
    -Werror=unused-variable -Werror=unused-function -Werror=unused-but-set-variable
    -Werror=deprecated-declarations

[env:tx]
extends = esp
build_flags = -DFFX_ROLE_TX=1
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_10:BD:A3:B1:B9:84-if00
monitor_port = ${this.upload_port}

[env:rx]
extends = esp
build_flags = -DFFX_ROLE_RX=1
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_10:BD:A3:B1:B9:00-if00
monitor_port = ${this.upload_port}

[env:tx-poc]
extends = env:tx
build_flags = ${env:tx.build_flags} -DFFX_POC=1

[env:rx-poc]
extends = env:rx
build_flags = ${env:rx.build_flags} -DFFX_POC=1

[env:native]
platform = native
test_framework = unity
build_flags = -std=c11 -Wall -Wextra -Werror
